version: '3.9'

services:
  mongo:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - my-network

  app:
    build: .
    container_name: my-app
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    networks:
      - my-network

volumes:
  mongo-data:

networks:
  my-network: