<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <header>
            <h1>Product card</h1>
        </header>
        <main>
            <div class="card">
                <div class="top-img">
                    <h1 class="top-name">NAME</h1>
                </div>

                <div class="details">
                    <p class="subHeading">Appreal</p>
                    <h3 class="heading">TECH JACKET</h3>
                </div>

                <div class="pricing">
                    <p class="price">$100</p>
                    <button class="button">
                        Add to Cart
                    </button>
                </div>

                <div class="discount">
                    <p class="tag">-20%</p>
                </div>
            </div>
        </main>
</body>
</html>
