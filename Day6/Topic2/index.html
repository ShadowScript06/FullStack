<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selecting elements</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="title">Hello</h1>
    <button id="btn">Click</button>

    <div class="box"></div>

    <p id="para">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Iusto temporibus
      quae rerum quod!
    </p>
    <button id="p1-btn">change</button>

    <div class="light"></div>

    <button id="dark-btn">Dark</button>

    <div>
      <ul id="list">
        <li>prajwal</li>
        <li>raj</li>
        <li>deep</li>
      </ul>

      <button id="addList">add</button>
    </div>

    <!-- //Problem 7 -->
    <div>
      <ul id="todo-list">
        <li>Learn JS <button class="delete-btn">Delete</button></li>
        <li>Practice DOM <button class="delete-btn">Delete</button></li>
        <li>Build Project <button class="delete-btn">Delete</button></li>
      </ul>
    </div>

    <!-- Problem 8 -->
    <div>
      <div id="counter-container">
        <p>Counter: <span id="counter-value">0</span></p>
        <button id="increment-btn">Increment</button>
      </div>
    </div>

    <!-- Problem 9 -->

    <div>
      <div id="parent" style="padding: 20px; background: #f0f0f0">
        Parent
        <button id="child">Child</button>
      </div>
    </div>

    <!-- Problem 10 -->
    <ul id="list10"></ul>

    <!-- Problem 11 -->
    <input type="text" id="search" placeholder="Search items..." />

    <ul id="item-list">
      <li>Apple</li>
      <li>Banana</li>
      <li>Mango</li>
      <li>Orange</li>
      <li>Pineapple</li>
    </ul>




  </body>
  <script src="script.js"></script>
</html>
