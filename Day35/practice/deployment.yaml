apiVersion: apps/v1

kind: Deployment

metadata:
  name: app-deployment

spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: my-app
        imagePullPolicy: Never
        ports:
          - containerPort: 3000

